name: publish image

on:
  workflow_dispatch:
    inputs:
      agents:
        description: "Agents to build (comma-separated)"
        type: string
        default: "claude,codex,gemini"
  pull_request:
    types:
      - closed
    branches:
      - main

# One group for every trigger: on a closed event github.ref is that pull
# request's own merge ref, so a per-ref group would let two merges publish in
# parallel and :latest would end up whichever finished last.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io

jobs:
  publish:
    # merged is only ever set on the pull request path, and ref_name is only
    # main on a dispatch started from main: a closed event runs on the pull
    # request's own merge ref.
    if: github.event.pull_request.merged || github.ref_name == 'main'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit, not the pull request head: a squash merge leaves
          # the head off main entirely and its branch is often deleted, so the
          # default ref would publish something that was never on main.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      # The merged pull request states which images it affects, rather than this
      # workflow inferring it from a diff -- a rebase merge leaves only the last
      # commit in HEAD~1..HEAD and used to publish the wrong subset.
      - name: select agents
        id: select
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          DISPATCH_AGENTS: ${{ inputs.agents }}
        run: |
          set -euo pipefail

          # Filtered against the known agents, so an unrelated label such as
          # dependencies can never become a build target.
          agents=""
          candidates="${DISPATCH_AGENTS:-${LABELS}}"
          for label in ${candidates//,/ }; do
            case "${label}" in
              claude | codex | gemini) agents="${agents:+${agents},}${label}" ;;
            esac
          done

          if [[ -z ${agents} ]]; then
            echo "no agent labels on this pull request; nothing to publish"
          else
            echo "publishing: ${agents}"
          fi
          echo "agents=${agents}" >> "${GITHUB_OUTPUT}"

          # Read back from the checkout rather than from github.sha, which on a
          # pull_request event is that request's merge ref and not the commit
          # this job actually publishes.
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"

      - name: set up docker buildx
        if: steps.select.outputs.agents != ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      # Before the first build rather than before the push: the base is pulled
      # from Docker Hub, and an anonymous pull shares its rate limit with every
      # other runner on the same address.
      - name: login to docker hub
        if: steps.select.outputs.agents != ''
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # The published build cannot be smoke tested directly: a multi-platform
      # image cannot be loaded into the daemon, and pulling it back after the
      # push would find the fault only once :latest had already moved. So the
      # host platform is built and loaded first, tested, and only then pushed.
      # The push reuses this build from the builder's own cache, so the amd64
      # layers it publishes are the ones that were tested; arm64 is untested.
      # No layer cache: the one layer each agent adds has inputs that change
      # every time, and the base beneath it is pulled, not built.
      - name: build the host platform for the smoke test
        if: steps.select.outputs.agents != ''
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          BUILD_AGENTS: ${{ steps.select.outputs.agents }}
          REVISION: ${{ steps.select.outputs.revision }}
          LOCAL: true
        with:
          targets: default
          push: false
          load: true

      - name: smoke test the built images
        if: steps.select.outputs.agents != ''
        env:
          AGENTS: ${{ steps.select.outputs.agents }}
        run: |
          set -euo pipefail
          .github/scripts/smoke-test.sh ${AGENTS//,/ }

      - name: build and push
        if: steps.select.outputs.agents != ''
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          BUILD_AGENTS: ${{ steps.select.outputs.agents }}
          REVISION: ${{ steps.select.outputs.revision }}
          LOCAL: false
        with:
          targets: default
          push: true
          set: |
            *.attest=type=provenance,mode=max
            *.attest=type=sbom,generator=docker/scout-sbom-indexer:latest

      - name: install cosign
        if: steps.select.outputs.agents != ''
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign published image(s) (keyless)
        if: steps.select.outputs.agents != ''
        run: |
          set -euo pipefail

          # Interpolated rather than passed through env:, which failed in
          # 432b779 with "Argument list too long" -- the metadata does not fit
          # in the environment the runner starts bash with.

          cat > bake-metadata.json <<'JSON'
          ${{ steps.bake.outputs.metadata }}
          JSON

          # Extract tag@digest refs from Bake metadata and sign them.
          jq -r '
            to_entries[]
            | .value as $v
            | ($v["containerimage.digest"] // empty) as $digest
            | ($v["image.name"] // empty) as $names
            | if ($digest == "" or $names == "") then empty else
                (if ($names|type) == "string" then ($names|split(",")) else $names end)
                | map(gsub("^\\s+|\\s+$"; ""))
                | map(select(length>0))
                | .[]
                | "\(.)@\($digest)"
              end
          ' bake-metadata.json | sort -u | while read -r ref; do
            echo "Signing ${ref}"
            cosign sign --yes "${ref}"
          done
