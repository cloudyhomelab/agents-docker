name: publish base image

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main
  # Weekly, for the Debian updates the apt layer would otherwise wait on; the
  # scheduled run rebuilds that layer without cache, see below.
  schedule:
    - cron: "0 3 * * 1"

# One group for every trigger, so two runs can never race on :latest.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io

jobs:
  publish:
    # A merge publishes only when the pull request was labelled base; a dispatch
    # or the schedule only from main. merged is only ever set on the pull
    # request path, whose ref is the request's own merge ref.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'base'))
      || (github.event_name != 'pull_request' && github.ref_name == 'main')

    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit, not the pull request head: a squash merge leaves
          # the head off main entirely and its branch is often deleted.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: name the build
        id: name
        run: |
          set -euo pipefail
          # Read back from the checkout rather than from github.sha, which on a
          # pull_request event is that request's merge ref.
          echo "revision=$(git rev-parse HEAD)" >> "${GITHUB_OUTPUT}"
          echo "tag=$(date -u +%Y.%m.%d.%H%M)" >> "${GITHUB_OUTPUT}"

          # The scheduled run drops the cache for the apt stage, and with it
          # every stage above, so Debian's updates actually land; everything
          # else relies on the cache as usual.
          if [[ ${GITHUB_EVENT_NAME} == schedule ]]; then
            echo "no-cache=base.no-cache-filter=base" >> "${GITHUB_OUTPUT}"
          else
            echo "no-cache=" >> "${GITHUB_OUTPUT}"
          fi

      - name: set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      # The published build cannot be smoke tested directly: a multi-platform
      # image cannot be loaded into the daemon, and pulling it back after the
      # push would find the fault only once :latest had already moved. So the
      # host platform is built and loaded first, tested, and only then pushed.
      # The push reuses this build from the builder's own cache, so the amd64
      # layers it publishes are the ones that were tested; arm64 is built under
      # emulation and relies on the native pre-merge build in pr.yml.
      - name: build the host platform for the smoke test
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          LOCAL: true
          REVISION: ${{ steps.name.outputs.revision }}
        with:
          files: base/docker-bake.hcl
          targets: base
          load: true
          set: |
            base.cache-from=type=gha,scope=base
            ${{ steps.name.outputs.no-cache }}

      - name: smoke test the base
        env:
          BAKE_FILE: base/docker-bake.hcl
        run: .github/scripts/smoke-test.sh base

      - name: login to docker hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One scope with one writer, so the ignore-error the agent publish needs
      # for its racing targets is not needed here.
      - name: build and push
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          LOCAL: false
          REVISION: ${{ steps.name.outputs.revision }}
          BASE_TAG: ${{ steps.name.outputs.tag }}
        with:
          files: base/docker-bake.hcl
          targets: base
          push: true
          set: |
            base.cache-from=type=gha,scope=base
            base.cache-to=type=gha,mode=max,scope=base
            ${{ steps.name.outputs.no-cache }}
            *.attest=type=provenance,mode=max
            *.attest=type=sbom,generator=docker/scout-sbom-indexer:latest

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign the published image (keyless)
        run: |
          set -euo pipefail

          # Interpolated rather than passed through env:, which failed in
          # 432b779 with "Argument list too long" -- the metadata does not fit
          # in the environment the runner starts bash with.
          cat > bake-metadata.json <<'JSON'
          ${{ steps.bake.outputs.metadata }}
          JSON

          # Extract tag@digest refs from Bake metadata and sign them.
          jq -r '
            to_entries[]
            | .value as $v
            | ($v["containerimage.digest"] // empty) as $digest
            | ($v["image.name"] // empty) as $names
            | if ($digest == "" or $names == "") then empty else
                (if ($names|type) == "string" then ($names|split(",")) else $names end)
                | map(gsub("^\\s+|\\s+$"; ""))
                | map(select(length>0))
                | .[]
                | "\(.)@\($digest)"
              end
          ' bake-metadata.json | sort -u | tee -a "${GITHUB_STEP_SUMMARY}" | while read -r ref; do
            echo "Signing ${ref}"
            cosign sign --yes "${ref}"
          done
