name: publish base image

on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - main
  # Weekly, for the Debian updates the apt layer would otherwise wait on; the
  # scheduled run rebuilds that layer without cache, see below.
  schedule:
    - cron: "0 3 * * 1"

# One group for every trigger, so two runs can never race on :latest.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

env:
  REGISTRY: docker.io
  IMAGE: docker.io/binarycodes/agent-base

jobs:
  # One native build per platform, each pushed by digest and untagged. Nothing
  # points at the pushed layers until the merge job has both digests, so a
  # platform that fails its smoke test leaves :latest where it was.
  build:
    # A merge publishes only when the pull request was labelled base; a dispatch
    # or the schedule only from main. merged is only ever set on the pull
    # request path, whose ref is the request's own merge ref.
    if: >-
      (github.event_name == 'pull_request' && github.event.pull_request.merged && contains(github.event.pull_request.labels.*.name, 'base'))
      || (github.event_name != 'pull_request' && github.ref_name == 'main')

    strategy:
      # A fault in one platform should leave the other's result visible, so
      # the failure can be read as platform-specific or not.
      fail-fast: false
      matrix:
        include:
          - platform: amd64
            runs-on: ubuntu-latest
          - platform: arm64
            runs-on: ubuntu-24.04-arm

    runs-on: ${{ matrix.runs-on }}

    permissions:
      contents: read

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit, not the pull request head: a squash merge leaves
          # the head off main entirely and its branch is often deleted.
          ref: ${{ github.event.pull_request.merge_commit_sha || github.ref }}

      - name: set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      # Built and loaded first so the smoke test runs against it; the push below
      # reuses this build from the builder's cache, so the layers published are
      # the ones tested. LOCAL keeps the build to the host platform, which is
      # this runner's own.
      - name: build the base for the smoke test
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          LOCAL: true
          REVISION: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        with:
          files: base/docker-bake.hcl
          targets: base
          load: true
          # The scheduled run drops the cache for the apt stage, and with it
          # every stage above, so Debian's updates actually land; everything
          # else relies on the cache as usual.
          set: |
            base.cache-from=type=gha,scope=base-${{ matrix.platform }}
            ${{ github.event_name == 'schedule' && 'base.no-cache-filter=base' || '' }}

      - name: smoke test the base
        env:
          BAKE_FILE: base/docker-bake.hcl
        run: .github/scripts/smoke-test.sh base

      - name: login to docker hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # One cache scope per platform and a single writer per scope, so the
      # ignore-error the agent publish needed for its racing targets is not
      # needed here.
      - name: push by digest
        id: bake
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          LOCAL: true
          PUSH_BY_DIGEST: true
          REVISION: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
        with:
          files: base/docker-bake.hcl
          targets: base
          set: |
            base.cache-from=type=gha,scope=base-${{ matrix.platform }}
            base.cache-to=type=gha,mode=max,scope=base-${{ matrix.platform }}
            ${{ github.event_name == 'schedule' && 'base.no-cache-filter=base' || '' }}
            *.attest=type=provenance,mode=max
            *.attest=type=sbom,generator=docker/scout-sbom-indexer:latest

      # Handed to the merge job as a file rather than a job output: outputs of
      # a matrix job collapse to one value, whichever leg wrote last.
      - name: record the digest
        env:
          METADATA: ${{ steps.bake.outputs.metadata }}
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail
          mkdir -p "${DIGESTS}"
          jq -er '.base["containerimage.digest"]' <<<"${METADATA}" > "${DIGESTS}/${{ matrix.platform }}"
          cat "${DIGESTS}/${{ matrix.platform }}"

      - name: upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.platform }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  # Joins the two platform digests into one manifest list, tags it, and signs
  # the list. The timestamp tag is year-first so it sorts chronologically,
  # which is the order Dependabot ranks candidate tags in.
  merge:
    needs: build
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: download the digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: digest-*
          path: ${{ runner.temp }}/digests
          merge-multiple: true

      - name: set up docker buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: login to docker hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: create and tag the manifest list
        id: manifest
        env:
          DIGESTS: ${{ runner.temp }}/digests
        run: |
          set -euo pipefail

          tag="$(date -u +%Y.%m.%d.%H%M)"
          refs=()
          for file in "${DIGESTS}"/*; do
            refs+=("${IMAGE}@$(cat "${file}")")
          done
          [[ ${#refs[@]} -eq 2 ]] || { echo "expected two platform digests, found ${#refs[@]}" >&2; exit 1; }

          docker buildx imagetools create \
            --tag "${IMAGE}:latest" \
            --tag "${IMAGE}:${tag}" \
            "${refs[@]}"

          digest="$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "${IMAGE}:${tag}")"
          echo "tag=${tag}" >> "${GITHUB_OUTPUT}"
          echo "digest=${digest}" >> "${GITHUB_OUTPUT}"

          {
            echo "### agent-base"
            echo
            echo "\`${IMAGE}:${tag}@${digest}\`"
            echo
            docker buildx imagetools inspect "${IMAGE}:${tag}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: sign the manifest list (keyless)
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
