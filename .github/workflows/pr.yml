name: verify pull request

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Intended as the required status check, so the job itself always runs and
  # decides internally whether there is anything to build. A skipped job never
  # reports a status and would leave every pull request waiting forever.
  verify:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both linters are deliberately ungated by the labels below: code the
      # linter rejects should fail the check even when no image is due to be
      # built.
      - name: lint the dockerfile
        uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml

      # The same file list as the pre-commit hook runs, glob included, so a
      # hook added later is linted without either side being updated.
      # shell-helper/zshrc is not listed: shellcheck has no zsh support.
      - name: lint the shell scripts
        run: shellcheck .githooks/* scripts/agent-entrypoint .github/scripts/*.sh

      # The linters prove the scripts parse; this proves their branches do what
      # the comments claim -- the entrypoint's JDK resolution order and the
      # version checks behind the automated bumps -- without building an image.
      # Ungated like the linters, and from the runner's apt rather than an
      # action, since bats is a single bash script.
      - name: test the shell scripts
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends bats
          bats tests

      # Skipped on the bump branch, which labels itself with only the agents it
      # bumped; the path rules would widen that to all three.
      - name: label the agents this pull request affects
        id: labeler
        if: github.head_ref != 'chore/bump-agent-versions'
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0

      - name: select agents
        id: select
        env:
          # The labeler's own view when it ran, and the labels already on the
          # pull request when it did not -- the bump branch's case.
          LABELS: ${{ steps.labeler.outputs.all-labels || join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail

          # Filtered against the known agents, so an unrelated label such as
          # dependencies can never become a build target.
          agents=""
          for label in ${LABELS//,/ }; do
            case "${label}" in
              claude | codex | gemini) agents="${agents:+${agents},}${label}" ;;
            esac
          done

          if [[ -z ${agents} ]]; then
            echo "no agent labels; nothing to verify"
          else
            echo "verifying: ${agents}"
          fi
          echo "agents=${agents}" >> "${GITHUB_OUTPUT}"

          # Matches the scopes the publish workflow writes, one per agent.
          {
            echo "cache<<CACHE_EOF"
            for agent in ${agents//,/ }; do
              echo "${agent}.cache-from=type=gha,scope=${agent}"
            done
            echo "CACHE_EOF"
          } >> "${GITHUB_OUTPUT}"

      - name: set up docker buildx
        if: steps.select.outputs.agents != ''
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
        with:
          driver: docker-container

      # Proves the toolchain and agent CLI versions actually install before they
      # reach main. push is false, and LOCAL keeps the build to the host
      # platform, which is also what lets load work: the docker-container
      # driver discards a build that is neither pushed nor loaded, and a
      # multi-platform one cannot be loaded at all.
      - name: build without publishing
        if: steps.select.outputs.agents != ''
        uses: docker/bake-action@d3418bd7d0e9324001bca92fa8ba175ea7e6dc9b # v7.3.0
        env:
          BUILD_AGENTS: ${{ steps.select.outputs.agents }}
          LOCAL: true
        with:
          targets: default
          push: false
          load: true
          # Reads main's cache but writes none: a pull request's cache is scoped
          # to its own branch, so writing it would only burn the quota.
          set: |
            ${{ steps.select.outputs.cache }}

      # The build proves the layers assemble; this proves the toolchain and the
      # agent CLI in the result actually start, and puts the versions it found
      # in the job summary, one table per image.
      - name: smoke test the built images
        if: steps.select.outputs.agents != ''
        env:
          AGENTS: ${{ steps.select.outputs.agents }}
        run: |
          set -euo pipefail
          .github/scripts/smoke-test.sh ${AGENTS//,/ }
