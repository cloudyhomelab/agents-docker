name: update agent versions

on:
  workflow_dispatch:
  schedule:
    - cron: "0 4 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}

jobs:
  agent-update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      # A pull request opened with the default GITHUB_TOKEN triggers no
      # pull_request or push events, so under branch protection it would carry
      # no labels and no required check and could never be merged. An App token
      # is attributed to the App rather than to this workflow, so the events
      # fire.
      - name: mint a token for the pull request
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.CLOUDYHOME_BOT_CLIENT_ID }}
          private-key: ${{ secrets.CLOUDYHOME_BOT_PRIVATE_KEY }}

      - name: checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: update agent versions
        id: update
        env:
          BUMP_LOG: ${{ runner.temp }}/bumps.txt
          # Lifts the release check off the anonymous api.github.com rate limit,
          # which is shared per IP with every other runner.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          ./.github/scripts/check-updates.sh

          # An empty log means nothing moved, and the outputs below stay unset
          # so the next step skips rather than describing a bump that is not
          # there.
          [[ -s "${BUMP_LOG}" ]] || { echo "no updates found"; exit 0; }

          # The subject names every agent at its new version, so the history
          # reads without opening the diff.
          {
            printf 'subject=chore: bump '
            awk '{ printf "%s%s %s", sep, $1, $3; sep = ", " } END { print "" }' "${BUMP_LOG}"
          } >> "${GITHUB_OUTPUT}"

          # Heredoc rather than a plain assignment, because the body spans lines.
          {
            echo 'body<<BUMP_BODY'
            echo 'automated update of agent versions.'
            echo
            awk '{ print "- " $1 " " $2 " -> " $3 }' "${BUMP_LOG}"
            echo 'BUMP_BODY'
          } >> "${GITHUB_OUTPUT}"

          # One label per bumped agent, which is what decides the images the
          # build publishes once this is merged. Newline separated, because the
          # path rules in .github/labeler.yml deliberately skip this branch and
          # these labels are all it will carry.
          {
            echo 'labels<<BUMP_LABELS'
            awk '{ print $1 }' "${BUMP_LOG}"
            echo 'BUMP_LABELS'
          } >> "${GITHUB_OUTPUT}"

      - name: create pr
        if: steps.update.outputs.subject != ''
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          sign-commits: true
          commit-message: ${{ steps.update.outputs.subject }}
          title: ${{ steps.update.outputs.subject }}
          body: ${{ steps.update.outputs.body }}
          labels: ${{ steps.update.outputs.labels }}
          branch: chore/bump-agent-versions
